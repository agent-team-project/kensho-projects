[package]
name = "xlite-core"
version = "0.1.0"
edition = "2021"
build = "build.rs"
license = "MIT"

[dependencies]
calamine = "0.36.0"
csv = "1.4.0"
inventory = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1.11.0"
toml = "0.8"
zip = { version = "8.6.0", default-features = false }
