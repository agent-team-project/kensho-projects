[[case]]
id = "FN-SIN-001"
desc = "SIN of zero returns zero"
setup = {}
formula = "=SIN(0)"
expect = { number = 0 }
tol = 1e-12

[[case]]
id = "FN-SIN-002"
desc = "SIN returns one for pi over two radians"
setup = {}
formula = "=SIN(PI()/2)"
expect = { number = 1 }
tol = 1e-12

[[case]]
id = "FN-SIN-003"
desc = "SIN preserves negative input sign behavior"
setup = {}
formula = "=SIN(-PI()/2)"
expect = { number = -1 }
tol = 1e-12

[[case]]
id = "FN-SIN-004"
desc = "SIN returns the sine of a nontrivial decimal radian input"
setup = {}
formula = "=SIN(0.5)"
expect = { number = 0.479425538604203 }
tol = 1e-12

[[case]]
id = "FN-SIN-005"
desc = "SIN coerces direct scalar numeric text"
setup = {}
formula = '=SIN("0.5")'
expect = { number = 0.479425538604203 }
tol = 1e-12

[[case]]
id = "FN-SIN-006"
desc = "SIN coerces direct scalar booleans"
setup = {}
formula = "=SIN(TRUE)"
expect = { number = 0.8414709848078965 }
tol = 1e-12

[[case]]
id = "FN-SIN-007"
desc = "SIN treats a blank cell reference as zero"
setup = {}
formula = "=SIN(A1)"
expect = { number = 0 }
tol = 1e-12

[[case]]
id = "FN-SIN-008"
desc = "SIN propagates an error input"
setup = {}
formula = "=SIN(1/0)"
expect = { error = "#DIV/0!" }

[[case]]
id = "FN-SIN-009"
desc = "SIN propagates scalar coercion errors"
setup = {}
formula = '=SIN("not numeric")'
expect = { error = "#VALUE!" }
