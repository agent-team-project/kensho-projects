[[case]]
id = "FN-PV-001"
desc = "PV returns Microsoft's car-loan present value example without currency rounding"
setup = {}
formula = "=PV(12%/12,4*12,-263.33)"
expect = { number = 9999.68275341816 }
tol = 1e-12

[[case]]
id = "FN-PV-002"
desc = "PV returns the present value of level end-of-period payments"
setup = {}
formula = "=PV(8%/12,20*12,500)"
expect = { number = -59777.14585118777 }
tol = 1e-12

[[case]]
id = "FN-PV-003"
desc = "PV includes a supplied future value"
setup = {}
formula = "=PV(8%/12,20*12,500,10000)"
expect = { number = -61806.85973769607 }
tol = 1e-12

[[case]]
id = "FN-PV-004"
desc = "PV beginning-of-period type changes the payment timing"
setup = {}
formula = "=PV(8%/12,20*12,500,0,1)"
expect = { number = -60175.660156862345 }
tol = 1e-12

[[case]]
id = "FN-PV-005"
desc = "PV uses the zero-rate relationship"
setup = {}
formula = "=PV(0,10,-100,0)"
expect = { number = 1000 }

[[case]]
id = "FN-PV-006"
desc = "PV defaults omitted future value and type to zero"
setup = {}
formula = "=PV(1%,12,-100)"
expect = { number = 1125.5077473484637 }
tol = 1e-12

[[case]]
id = "FN-PV-007"
desc = "PV truncates payment type toward zero"
setup = {}
formula = "=PV(8%/12,20*12,500,0,1.9)"
expect = { number = -60175.660156862345 }
tol = 1e-12

[[case]]
id = "FN-PV-008"
desc = "PV rejects payment types other than zero or one after truncation"
setup = {}
formula = "=PV(1%,12,-100,0,2)"
expect = { error = "#NUM!" }

[[case]]
id = "FN-PV-009"
desc = "PV returns NUM for a non-finite argument"
setup = {}
formula = '=PV("1E309",10,-100)'
expect = { error = "#NUM!" }

[[case]]
id = "FN-PV-010"
desc = "PV returns NUM when the computed factor is non-finite"
setup = {}
formula = "=PV(1000,1000,-100)"
expect = { error = "#NUM!" }

[[case]]
id = "FN-PV-011"
desc = "PV propagates a numeric coercion error"
setup = {}
formula = '=PV("not numeric",10,-100)'
expect = { error = "#VALUE!" }

[[case]]
id = "FN-PV-012"
desc = "PV returns VALUE for too few arguments"
setup = {}
formula = "=PV(1%,12)"
expect = { error = "#VALUE!" }

[[case]]
id = "FN-PV-013"
desc = "PV returns VALUE for too many arguments"
setup = {}
formula = "=PV(1%,12,-100,0,0,0)"
expect = { error = "#VALUE!" }
