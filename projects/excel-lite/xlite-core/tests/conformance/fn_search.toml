[[case]]
id = "FN-SEARCH-001"
desc = "SEARCH finds a case-insensitive substring"
setup = {}
formula = '=SEARCH("margin", "Gross MARGIN")'
expect = { number = 7 }

[[case]]
id = "FN-SEARCH-002"
desc = "SEARCH start_num skips earlier matches but returns full text position"
setup = {}
formula = '=SEARCH("a", "banana", 3)'
expect = { number = 4 }

[[case]]
id = "FN-SEARCH-003"
desc = "SEARCH returns VALUE when find_text is not found"
setup = {}
formula = '=SEARCH("z", "abc")'
expect = { error = "#VALUE!" }

[[case]]
id = "FN-SEARCH-004"
desc = "SEARCH question mark wildcard matches one character"
setup = {}
formula = '=SEARCH("c?t", "concatenate")'
expect = { number = 4 }

[[case]]
id = "FN-SEARCH-005"
desc = "SEARCH asterisk wildcard matches zero or more characters"
setup = {}
formula = '=CONCAT(SEARCH("a*d", "xxabbbd"), ":", SEARCH("a*d", "xxad"))'
expect = { text = "3:3" }

[[case]]
id = "FN-SEARCH-006"
desc = "SEARCH coerces scalar text arguments and numeric start_num"
setup = {}
formula = '=SEARCH(23, 12345, "2.9")'
expect = { number = 2 }

[[case]]
id = "FN-SEARCH-007"
desc = "SEARCH returns VALUE when start_num truncates below one"
setup = {}
formula = '=SEARCH("a", "abc", 0.9)'
expect = { error = "#VALUE!" }

[[case]]
id = "FN-SEARCH-008"
desc = "SEARCH returns VALUE when start_num exceeds text length"
setup = {}
formula = '=SEARCH("a", "abc", 4)'
expect = { error = "#VALUE!" }

[[case]]
id = "FN-SEARCH-009"
desc = "SEARCH propagates error values"
setup = {}
formula = '=SEARCH(1/0, "abc")'
expect = { error = "#DIV/0!" }

[[case]]
id = "FN-SEARCH-010"
desc = "SEARCH returns VALUE for too few arguments"
setup = {}
formula = '=SEARCH("abc")'
expect = { error = "#VALUE!" }

[[case]]
id = "FN-SEARCH-011"
desc = "SEARCH returns VALUE for too many arguments"
setup = {}
formula = '=SEARCH("a", "abc", 1, 2)'
expect = { error = "#VALUE!" }
