[[case]]
id = "FN-NPV-001"
desc = "NPV matches Microsoft's future cash-flow example"
setup = {}
formula = "=NPV(0.1,-10000,3000,4200,6800)"
expect = { number = 1188.4434123352207 }
tol = 1e-12

[[case]]
id = "FN-NPV-002"
desc = "NPV range cash flows match direct cash flows"
setup = { A1 = 0.1, A2 = -10000, A3 = 3000, A4 = 4200, A5 = 6800 }
formula = "=NPV(A1,A2:A5)"
expect = { number = 1188.4434123352207 }
tol = 1e-12

[[case]]
id = "FN-NPV-003"
desc = "NPV supports the beginning-period adjustment pattern"
setup = { A1 = -40000, A2 = 8000, A3 = 9200, A4 = 10000, A5 = 12000, A6 = 14500 }
formula = "=NPV(0.08,A2:A6)+A1"
expect = { number = 1922.061554932363 }
tol = 1e-12

[[case]]
id = "FN-NPV-004"
desc = "NPV discounts the first counted cash flow one period"
setup = {}
formula = "=NPV(0.1,-100,60,60)"
expect = { number = 3.7565740045078755 }
tol = 1e-12

[[case]]
id = "FN-NPV-005"
desc = "NPV ignores blanks logicals text numeric text and errors in cash-flow inputs"
setup = { A1 = -100, B1 = true, C1 = '="60"', A2 = "=1/0", C2 = 60 }
formula = '=NPV(0.1,A1:C2,"60",FALSE,1/0,60)'
expect = { number = 3.7565740045078755 }
tol = 1e-12

[[case]]
id = "FN-NPV-006"
desc = "NPV propagates a rate error"
setup = {}
formula = "=NPV(1/0,100)"
expect = { error = "#DIV/0!" }

[[case]]
id = "FN-NPV-007"
desc = "NPV returns NUM when one plus rate is not positive"
setup = {}
formula = "=NPV(-1,100)"
expect = { error = "#NUM!" }

[[case]]
id = "FN-NPV-008"
desc = "NPV returns VALUE for too few arguments"
setup = {}
formula = "=NPV(0.1)"
expect = { error = "#VALUE!" }

