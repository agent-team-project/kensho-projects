[[case]]
id = "FN-NPV-010"
desc = "NPV returns zero when no cash flows are counted"
setup = { A1 = true, A2 = '="100"', A3 = "=1/0" }
formula = '=NPV(0.1,A1:A3,"200",FALSE)'
expect = { number = 0 }

