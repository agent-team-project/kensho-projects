[[case]]
id = "FN-SQRT-001"
desc = "SQRT returns the root of a positive number"
setup = {}
formula = "=SQRT(81)"
expect = { number = 9 }

[[case]]
id = "FN-SQRT-002"
desc = "SQRT returns zero for the zero boundary"
setup = {}
formula = "=SQRT(0)"
expect = { number = 0 }

[[case]]
id = "FN-SQRT-003"
desc = "SQRT returns NUM for a negative number"
setup = {}
formula = "=SQRT(-1)"
expect = { error = "#NUM!" }

[[case]]
id = "FN-SQRT-004"
desc = "SQRT coerces direct scalar numeric text"
setup = {}
formula = '=SQRT("2.25")'
expect = { number = 1.5 }

[[case]]
id = "FN-SQRT-005"
desc = "SQRT treats a blank cell reference as zero"
setup = {}
formula = "=SQRT(A1)"
expect = { number = 0 }
