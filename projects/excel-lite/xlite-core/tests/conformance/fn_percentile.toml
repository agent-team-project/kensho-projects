[[case]]
id = "FN-PERCENTILE-001"
desc = "PERCENTILE with k zero returns the minimum"
setup = { A1 = 12, A2 = -3, A3 = 4 }
formula = "=PERCENTILE(A1:A3,0)"
expect = { number = -3 }

[[case]]
id = "FN-PERCENTILE-002"
desc = "PERCENTILE with k one returns the maximum"
setup = { A1 = 12, A2 = -3, A3 = 4 }
formula = "=PERCENTILE(A1:A3,1)"
expect = { number = 12 }

[[case]]
id = "FN-PERCENTILE-003"
desc = "PERCENTILE interpolates when k does not land on an exact position"
setup = { A1 = 1, A2 = 2, A3 = 3, A4 = 4 }
formula = "=PERCENTILE(A1:A4,0.25)"
expect = { number = 1.75 }

[[case]]
id = "FN-PERCENTILE-004"
desc = "PERCENTILE returns the exact data point when k lands on a position"
setup = { A1 = 5, A2 = 1, A3 = 3, A4 = 2, A5 = 4 }
formula = "=PERCENTILE(A1:A5,0.5)"
expect = { number = 3 }

[[case]]
id = "FN-PERCENTILE-005"
desc = "PERCENTILE returns a single numeric range value for valid k"
setup = { A1 = 9 }
formula = "=PERCENTILE(A1:A1,0.6)"
expect = { number = 9 }

[[case]]
id = "FN-PERCENTILE-006"
desc = "PERCENTILE direct scalar array input behaves as a one item data set"
setup = {}
formula = '=PERCENTILE("4.5",0.2)'
expect = { number = 4.5 }

[[case]]
id = "FN-PERCENTILE-007"
desc = "PERCENTILE ignores range text booleans and blanks while including zero"
setup = { A1 = "skip", A2 = true, A3 = 0, A5 = 10 }
formula = "=PERCENTILE(A1:A5,0.5)"
expect = { number = 5 }

[[case]]
id = "FN-PERCENTILE-008"
desc = "PERCENTILE returns NUM when no numeric range values remain"
setup = { A1 = "x", A2 = true }
formula = "=PERCENTILE(A1:A3,0.5)"
expect = { error = "#NUM!" }

[[case]]
id = "FN-PERCENTILE-009"
desc = "PERCENTILE returns NUM when k is negative"
setup = {}
formula = "=PERCENTILE(8,-0.1)"
expect = { error = "#NUM!" }

[[case]]
id = "FN-PERCENTILE-010"
desc = "PERCENTILE returns NUM when k is greater than one"
setup = {}
formula = "=PERCENTILE(8,1.1)"
expect = { error = "#NUM!" }

[[case]]
id = "FN-PERCENTILE-011"
desc = "PERCENTILE returns NUM when k is nonfinite"
setup = {}
formula = "=PERCENTILE(8,1E309)"
expect = { error = "#NUM!" }

[[case]]
id = "FN-PERCENTILE-012"
desc = "PERCENTILE returns VALUE for direct array text that cannot be coerced"
setup = {}
formula = '=PERCENTILE("apple",0.5)'
expect = { error = "#VALUE!" }

[[case]]
id = "FN-PERCENTILE-013"
desc = "PERCENTILE returns VALUE for k text that cannot be coerced"
setup = {}
formula = '=PERCENTILE(1,"apple")'
expect = { error = "#VALUE!" }

[[case]]
id = "FN-PERCENTILE-014"
desc = "PERCENTILE propagates direct array errors"
setup = {}
formula = "=PERCENTILE(1/0,0.5)"
expect = { error = "#DIV/0!" }

[[case]]
id = "FN-PERCENTILE-015"
desc = "PERCENTILE propagates direct k errors before coercion"
setup = {}
formula = "=PERCENTILE(1,1/0)"
expect = { error = "#DIV/0!" }

[[case]]
id = "FN-PERCENTILE-016"
desc = "PERCENTILE propagates range errors"
setup = { A1 = 1, A2 = "=1/0" }
formula = "=PERCENTILE(A1:A2,0.5)"
expect = { error = "#DIV/0!" }

[[case]]
id = "FN-PERCENTILE-017"
desc = "PERCENTILE returns VALUE for too few arguments"
setup = {}
formula = "=PERCENTILE(1)"
expect = { error = "#VALUE!" }

[[case]]
id = "FN-PERCENTILE-018"
desc = "PERCENTILE returns VALUE for too many arguments"
setup = {}
formula = "=PERCENTILE(1,0.5,2)"
expect = { error = "#VALUE!" }
