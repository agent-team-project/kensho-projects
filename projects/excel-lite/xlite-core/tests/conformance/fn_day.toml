[[case]]
id = "FN-DAY-001"
desc = "DAY returns the first day for a DATE result"
setup = {}
formula = "=DAY(DATE(2020,1,1))"
expect = { number = 1 }

[[case]]
id = "FN-DAY-002"
desc = "DAY returns the day from a non-first-of-month DATE result"
setup = {}
formula = "=DAY(DATE(2024,3,15))"
expect = { number = 15 }

[[case]]
id = "FN-DAY-003"
desc = "DAY uses the date portion of a positive fractional serial"
setup = {}
formula = "=DAY(43831.75)"
expect = { number = 1 }

[[case]]
id = "FN-DAY-004"
desc = "DAY preserves the Excel 1900 phantom day"
setup = {}
formula = "=DAY(60)"
expect = { number = 29 }

[[case]]
id = "FN-DAY-005"
desc = "DAY coerces numeric text through the serial date helper"
setup = {}
formula = '=DAY("45366")'
expect = { number = 15 }

[[case]]
id = "FN-DAY-006"
desc = "DAY returns NUM for negative serials"
setup = {}
formula = "=DAY(-1)"
expect = { error = "#NUM!" }

[[case]]
id = "FN-DAY-007"
desc = "DAY returns NUM for zero serials"
setup = {}
formula = "=DAY(0)"
expect = { error = "#NUM!" }

[[case]]
id = "FN-DAY-008"
desc = "DAY returns VALUE for date text until DATEVALUE parsing exists"
setup = {}
formula = '=DAY("2020-01-01")'
expect = { error = "#VALUE!" }

[[case]]
id = "FN-DAY-009"
desc = "DAY returns VALUE for too few arguments"
setup = {}
formula = "=DAY()"
expect = { error = "#VALUE!" }

[[case]]
id = "FN-DAY-010"
desc = "DAY returns VALUE for too many arguments"
setup = {}
formula = "=DAY(43831,1)"
expect = { error = "#VALUE!" }
