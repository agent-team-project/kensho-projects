[[case]]
id = "FN-TODAY-001"
desc = "TODAY returns the deterministic default serial"
setup = {}
formula = "=TODAY()"
expect = { number = 1 }

[[case]]
id = "FN-TODAY-002"
desc = "TODAY participates in numeric arithmetic"
setup = {}
formula = "=TODAY()+5"
expect = { number = 6 }

[[case]]
id = "FN-TODAY-003"
desc = "TODAY rejects arguments"
setup = {}
formula = "=TODAY(1)"
expect = { error = "#VALUE!" }

[[case]]
id = "FN-TODAY-004"
desc = "TODAY is deterministic across repeated calls in a formula"
setup = {}
formula = "=TODAY()+TODAY()"
expect = { number = 2 }

[[case]]
id = "FN-TODAY-005"
desc = "TODAY drives IF as a nonzero serial"
setup = {}
formula = "=IF(TODAY(),1,2)"
expect = { number = 1 }
