[[case]]
id = "FN-CONCATENATE-001"
desc = "CONCATENATE concatenates text literals"
setup = {}
formula = '=CONCATENATE("Hello"," ","world")'
expect = { text = "Hello world" }

[[case]]
id = "FN-CONCATENATE-002"
desc = "CONCATENATE concatenates cell references with number, boolean, blank, and text values"
setup = { A1 = 12, B1 = true, D1 = "tail" }
formula = '=CONCATENATE(A1,"-",B1,"-",C1,"-",D1)'
expect = { text = "12-TRUE--tail" }

[[case]]
id = "FN-CONCATENATE-003"
desc = "CONCATENATE scans range arguments in row-major order"
setup = { A1 = "A", B1 = "B", A2 = "C", B2 = "D" }
formula = "=CONCATENATE(A1:B2)"
expect = { text = "ABCD" }

[[case]]
id = "FN-CONCATENATE-004"
desc = "CONCATENATE propagates error values"
setup = { A1 = "prefix", B1 = "=1/0", C1 = "ignored" }
formula = "=CONCATENATE(A1:C1)"
expect = { error = "#DIV/0!" }

[[case]]
id = "FN-CONCATENATE-005"
desc = "CONCATENATE returns VALUE for wrong arity"
setup = {}
formula = "=CONCATENATE()"
expect = { error = "#VALUE!" }
