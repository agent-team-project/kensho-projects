[[case]]
id = "FN-CONCAT-001"
desc = "CONCAT concatenates text literals"
setup = {}
formula = '=CONCAT("Hello"," ","world")'
expect = { text = "Hello world" }

[[case]]
id = "FN-CONCAT-002"
desc = "CONCAT concatenates cell references with number, boolean, blank, and text values"
setup = { A1 = 12, B1 = true, D1 = "tail" }
formula = '=CONCAT(A1,"-",B1,"-",C1,"-",D1)'
expect = { text = "12-TRUE--tail" }

[[case]]
id = "FN-CONCAT-003"
desc = "CONCAT scans range arguments in row-major order"
setup = { A1 = "A", B1 = "B", A2 = "C", B2 = "D" }
formula = "=CONCAT(A1:B2)"
expect = { text = "ABCD" }

[[case]]
id = "FN-CONCAT-004"
desc = "CONCAT propagates error values"
setup = { A1 = "prefix", B1 = "=1/0", C1 = "ignored" }
formula = "=CONCAT(A1:C1)"
expect = { error = "#DIV/0!" }

[[case]]
id = "FN-CONCAT-005"
desc = "CONCAT returns VALUE for wrong arity"
setup = {}
formula = "=CONCAT()"
expect = { error = "#VALUE!" }
