[[case]]
id = "FN-TRUE-001"
desc = "TRUE returns the boolean TRUE value"
setup = {}
formula = "=TRUE()"
expect = { bool = true }

[[case]]
id = "FN-TRUE-002"
desc = "TRUE drives IF to the true branch"
setup = {}
formula = "=IF(TRUE(),1,2)"
expect = { number = 1 }

[[case]]
id = "FN-TRUE-003"
desc = "TRUE coerces to one in arithmetic"
setup = {}
formula = "=TRUE()+1"
expect = { number = 2 }

[[case]]
id = "FN-TRUE-004"
desc = "TRUE coerces to text in concatenation"
setup = {}
formula = '=TRUE()&"x"'
expect = { text = "TRUEx" }

[[case]]
id = "FN-TRUE-005"
desc = "TRUE rejects arguments"
setup = {}
formula = "=TRUE(1)"
expect = { error = "#VALUE!" }
