[[case]]
id = "FN-DB-008"
desc = "DB defaults omitted month to twelve"
setup = {}
formula = "=DB(1000, 100, 5, 1)"
expect = { number = 369 }
tol = 1e-12

[[case]]
id = "FN-DB-009"
desc = "DB truncates period and month toward zero"
setup = {}
formula = "=DB(1000000, 100000, 6, 2.9, 7.9)"
expect = { number = 259639.41666666666 }
tol = 1e-12

[[case]]
id = "FN-DB-010"
desc = "DB handles a large period and life without iterating over periods"
setup = {}
formula = "=DB(1000, 0, 1000000000000, 1000000000000)"
expect = { number = 0 }

[[case]]
id = "FN-DB-011"
desc = "DB returns NUM for negative salvage"
setup = {}
formula = "=DB(1000, -1, 5, 1)"
expect = { error = "#NUM!" }

[[case]]
id = "FN-DB-012"
desc = "DB returns NUM when salvage is greater than cost"
setup = {}
formula = "=DB(1000, 1001, 5, 1)"
expect = { error = "#NUM!" }

[[case]]
id = "FN-DB-013"
desc = "DB returns NUM when life is not positive"
setup = {}
formula = "=DB(1000, 100, 0, 1)"
expect = { error = "#NUM!" }

[[case]]
id = "FN-DB-014"
desc = "DB returns NUM for an invalid month"
setup = {}
formula = "=DB(1000, 100, 5, 1, 13)"
expect = { error = "#NUM!" }

[[case]]
id = "FN-DB-015"
desc = "DB returns NUM when period exceeds the allowed final period"
setup = {}
formula = "=DB(1000, 100, 5, 6)"
expect = { error = "#NUM!" }

[[case]]
id = "FN-DB-016"
desc = "DB returns NUM for a non-finite numeric argument"
setup = {}
formula = "=DB(1E309, 0, 1, 1)"
expect = { error = "#NUM!" }

[[case]]
id = "FN-DB-017"
desc = "DB returns VALUE for invalid numeric text"
setup = {}
formula = '=DB("not numeric", 0, 1, 1)'
expect = { error = "#VALUE!" }

[[case]]
id = "FN-DB-018"
desc = "DB propagates the first numeric coercion error"
setup = {}
formula = '=DB(1000, 1/0, "not numeric", 1)'
expect = { error = "#DIV/0!" }

[[case]]
id = "FN-DB-019"
desc = "DB returns VALUE for too few arguments"
setup = {}
formula = "=DB(1000, 100, 5)"
expect = { error = "#VALUE!" }

[[case]]
id = "FN-DB-020"
desc = "DB returns VALUE for too many arguments"
setup = {}
formula = "=DB(1000, 100, 5, 1, 12, 0)"
expect = { error = "#VALUE!" }
