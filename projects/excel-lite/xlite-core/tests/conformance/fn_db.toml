id = "FN-DB-002"
desc = "DB returns the Microsoft depreciation example period 2"
setup = {}
formula = "=DB(1000000, 100000, 6, 2, 7)"
expect = { number = 259639.41666666666 }
tol = 1e-12

[[case]]
id = "FN-DB-003"
desc = "DB returns the Microsoft depreciation example period 3"
