[[case]]
id = "FN-DB-001"
desc = "DB returns the Microsoft depreciation example period 1"
setup = {}
formula = "=DB(1000000, 100000, 6, 1, 7)"
expect = { number = 186083.33333333334 }
tol = 1e-12

