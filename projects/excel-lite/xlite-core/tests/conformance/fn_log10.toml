[[case]]
id = "FN-LOG10-001"
desc = "LOG10 returns one for ten"
setup = {}
formula = "=LOG10(10)"
expect = { number = 1 }
tol = 1e-12

[[case]]
id = "FN-LOG10-002"
desc = "LOG10 returns the exponent for a power of ten"
setup = {}
formula = "=LOG10(100000)"
expect = { number = 5 }
tol = 1e-12

[[case]]
id = "FN-LOG10-003"
desc = "LOG10 returns the base-10 logarithm for a non-power positive number"
setup = {}
formula = "=LOG10(86)"
expect = { number = 1.9344984512435677 }
tol = 1e-12

[[case]]
id = "FN-LOG10-004"
desc = "LOG10 of zero returns NUM error"
setup = {}
formula = "=LOG10(0)"
expect = { error = "#NUM!" }

[[case]]
id = "FN-LOG10-005"
desc = "LOG10 of a negative number returns NUM error"
setup = {}
formula = "=LOG10(-5)"
expect = { error = "#NUM!" }

[[case]]
id = "FN-LOG10-006"
desc = "LOG10 coerces direct scalar numeric text"
setup = {}
formula = '=LOG10("100")'
expect = { number = 2 }
tol = 1e-12

[[case]]
id = "FN-LOG10-007"
desc = "LOG10 coerces direct scalar booleans"
setup = {}
formula = "=LOG10(TRUE)"
expect = { number = 0 }
tol = 1e-12

[[case]]
id = "FN-LOG10-008"
desc = "LOG10 treats a blank cell reference as zero"
setup = {}
formula = "=LOG10(A1)"
expect = { error = "#NUM!" }

[[case]]
id = "FN-LOG10-009"
desc = "LOG10 propagates an error input"
setup = {}
formula = "=LOG10(1/0)"
expect = { error = "#DIV/0!" }
