[[case]]
id = "FN-VAR-001"
desc = "VAR returns sample variance for the Microsoft example data set"
setup = { A1 = 1345, A2 = 1301, A3 = 1368, A4 = 1322, A5 = 1310, A6 = 1370, A7 = 1318, A8 = 1350, A9 = 1303, A10 = 1299 }
formula = "=VAR(A1:A10)"
expect = { number = 754.2666666666667 }

[[case]]
id = "FN-VAR-002"
desc = "VAR combines range values and direct scalar values"
setup = { A1 = 1, A2 = 2 }
formula = "=VAR(A1:A2,3)"
expect = { number = 1 }

[[case]]
id = "FN-VAR-003"
desc = "VAR coerces direct numeric text booleans and blank references"
setup = {}
formula = '=VAR("3",TRUE,FALSE,A1)'
expect = { number = 2 }

[[case]]
id = "FN-VAR-004"
desc = "VAR ignores range text booleans and blanks while including zero"
setup = { A1 = 2, A2 = "skip", A3 = true, A4 = 0, A6 = 4 }
formula = "=VAR(A1:A6)"
expect = { number = 4 }

[[case]]
id = "FN-VAR-005"
desc = "VAR returns DIV0 when fewer than two numeric values remain"
setup = { A1 = "x", A2 = true }
formula = "=VAR(A1:A3)"
expect = { error = "#DIV/0!" }

[[case]]
id = "FN-VAR-006"
desc = "VAR propagates direct non-numeric text"
setup = {}
formula = '=VAR("apple",1)'
expect = { error = "#VALUE!" }

[[case]]
id = "FN-VAR-007"
desc = "VAR propagates direct errors"
setup = {}
formula = "=VAR(1,1/0)"
expect = { error = "#DIV/0!" }

[[case]]
id = "FN-VAR-008"
desc = "VAR returns VALUE for wrong arity"
setup = {}
formula = "=VAR()"
expect = { error = "#VALUE!" }
