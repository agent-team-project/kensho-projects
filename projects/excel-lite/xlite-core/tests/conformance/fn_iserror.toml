[[case]]
id = "FN-ISERROR-EL294-001"
desc = "ISERROR returns TRUE for a DIV/0 error expression"
setup = {}
formula = "=ISERROR(1/0)"
expect = { bool = true }

[[case]]
id = "FN-ISERROR-EL294-002"
desc = "ISERROR returns TRUE for NA from MODE"
setup = {}
formula = "=ISERROR(MODE(1,2))"
expect = { bool = true }

[[case]]
id = "FN-ISERROR-EL294-003"
desc = "ISERROR returns FALSE for numbers"
setup = {}
formula = "=ISERROR(42)"
expect = { bool = false }

[[case]]
id = "FN-ISERROR-EL294-004"
desc = "ISERROR returns FALSE for text"
setup = {}
formula = '=ISERROR("text")'
expect = { bool = false }

[[case]]
id = "FN-ISERROR-EL294-005"
desc = "ISERROR returns FALSE for booleans"
setup = {}
formula = "=ISERROR(TRUE)"
expect = { bool = false }

[[case]]
id = "FN-ISERROR-EL294-006"
desc = "ISERROR returns FALSE for a blank cell reference"
setup = {}
formula = "=ISERROR(A1)"
expect = { bool = false }

[[case]]
id = "FN-ISERROR-EL294-007"
desc = "ISERROR range scalar convention returns TRUE when top-left is an error"
setup = { A1 = "=1/0", A2 = 42 }
formula = "=ISERROR(A1:A2)"
expect = { bool = true }

[[case]]
id = "FN-ISERROR-EL294-008"
desc = "ISERROR range scalar convention ignores later errors when top-left is not an error"
setup = { A1 = 42, A2 = "=1/0" }
formula = "=ISERROR(A1:A2)"
expect = { bool = false }

[[case]]
id = "FN-ISERROR-EL294-009"
desc = "ISERROR returns VALUE when too few arguments are supplied"
setup = {}
formula = "=ISERROR()"
expect = { error = "#VALUE!" }

[[case]]
id = "FN-ISERROR-EL294-010"
desc = "ISERROR returns VALUE when too many arguments are supplied"
setup = {}
formula = "=ISERROR(1,2)"
expect = { error = "#VALUE!" }
