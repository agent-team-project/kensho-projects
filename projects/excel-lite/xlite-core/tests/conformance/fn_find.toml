[[case]]
id = "FN-FIND-001"
desc = "FIND returns a one-based position for a case-sensitive substring"
setup = {}
formula = '=FIND("world", "Hello world")'
expect = { number = 7 }

[[case]]
id = "FN-FIND-002"
desc = "FIND distinguishes case and returns VALUE when case differs"
setup = {}
formula = '=FIND("World", "Hello world")'
expect = { error = "#VALUE!" }

[[case]]
id = "FN-FIND-003"
desc = "FIND start_num skips earlier matches but returns a full-text position"
setup = {}
formula = '=FIND("is", "Mississippi", 4)'
expect = { number = 5 }

[[case]]
id = "FN-FIND-004"
desc = "FIND returns VALUE when find_text is missing"
setup = {}
formula = '=FIND("z", "abcdef")'
expect = { error = "#VALUE!" }

[[case]]
id = "FN-FIND-005"
desc = "FIND coerces scalar text and numeric start_num arguments"
setup = {}
formula = '=FIND(3, 12345, "2.9")'
expect = { number = 3 }

[[case]]
id = "FN-FIND-006"
desc = "FIND returns VALUE when start_num truncates below one"
setup = {}
formula = '=FIND("a", "abc", 0.9)'
expect = { error = "#VALUE!" }

[[case]]
id = "FN-FIND-007"
desc = "FIND returns VALUE when start_num exceeds within_text length"
setup = {}
formula = '=FIND("a", "abc", 4)'
expect = { error = "#VALUE!" }

[[case]]
id = "FN-FIND-008"
desc = "FIND propagates errors from find_text coercion"
setup = {}
formula = '=FIND(1/0, "abc")'
expect = { error = "#DIV/0!" }

[[case]]
id = "FN-FIND-009"
desc = "FIND propagates errors from within_text coercion"
setup = {}
formula = '=FIND("a", 1/0)'
expect = { error = "#DIV/0!" }

[[case]]
id = "FN-FIND-010"
desc = "FIND propagates errors from start_num coercion"
setup = {}
formula = '=FIND("a", "abc", 1/0)'
expect = { error = "#DIV/0!" }

[[case]]
id = "FN-FIND-011"
desc = "FIND returns VALUE for too few arguments"
setup = {}
formula = '=FIND("a")'
expect = { error = "#VALUE!" }

[[case]]
id = "FN-FIND-012"
desc = "FIND returns VALUE for too many arguments"
setup = {}
formula = '=FIND("a", "abc", 1, 2)'
expect = { error = "#VALUE!" }
