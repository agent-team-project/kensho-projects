[[case]]
id = "FN-MATCH-001"
desc = "MATCH returns the position for an exact numeric match"
setup = { A1 = 10, A2 = 25, A3 = 30 }
formula = "=MATCH(25,A1:A3,0)"
expect = { number = 2 }

[[case]]
id = "FN-MATCH-002"
desc = "MATCH returns the Microsoft approximate ascending example position"
setup = { B2 = 25, B3 = 38, B4 = 40, B5 = 41 }
formula = "=MATCH(39,B2:B5,1)"
expect = { number = 2 }

[[case]]
id = "FN-MATCH-003"
desc = "MATCH returns the Microsoft exact example position"
setup = { B2 = 25, B3 = 38, B4 = 40, B5 = 41 }
formula = "=MATCH(41,B2:B5,0)"
expect = { number = 4 }

[[case]]
id = "FN-MATCH-004"
desc = "MATCH returns NA for the Microsoft descending example on ascending data"
setup = { B2 = 25, B3 = 38, B4 = 40, B5 = 41 }
formula = "=MATCH(40,B2:B5,-1)"
expect = { error = "#N/A" }

[[case]]
id = "FN-MATCH-005"
desc = "MATCH exact text comparison is case-insensitive"
setup = { A1 = "Alpha", A2 = "Beta" }
formula = '=MATCH("alpha",A1:A2,0)'
expect = { number = 1 }

[[case]]
id = "FN-MATCH-006"
desc = "MATCH exact text wildcard comparison supports star, question mark, and tilde escapes"
setup = { C1 = "Alpha", C2 = "Alpine", D1 = "Boat", D2 = "Bat", E1 = "file123", E2 = "file*", F1 = "Q~1", G1 = "what?" }
formula = '=CONCAT(MATCH("Al*",C1:C2,0),":",MATCH("B?t",D1:D2,0),":",MATCH("file~*",E1:E2,0),":",MATCH("Q~~1",F1:F1,0),":",MATCH("what~?",G1:G1,0))'
expect = { text = "1:2:2:1:1" }

[[case]]
id = "FN-MATCH-007"
desc = "MATCH exact mode does not coerce numeric text to numbers"
setup = { A1 = 5, A2 = '="5"' }
formula = '=MATCH("5",A1:A2,0)'
expect = { number = 2 }

[[case]]
id = "FN-MATCH-008"
desc = "MATCH treats a scalar lookup_array as a one-element array"
setup = {}
formula = "=MATCH(7,7,0)"
expect = { number = 1 }

[[case]]
id = "FN-MATCH-009"
desc = "MATCH returns NA when no match is found"
setup = { A1 = 10, A2 = 25, A3 = 30 }
formula = "=MATCH(99,A1:A3,0)"
expect = { error = "#N/A" }

[[case]]
id = "FN-MATCH-010"
desc = "MATCH returns VALUE for a two-dimensional lookup_array"
setup = { A1 = 1, A2 = 2, B1 = 3, B2 = 4 }
formula = "=MATCH(2,A1:B2,0)"
expect = { error = "#VALUE!" }

[[case]]
id = "FN-MATCH-011"
desc = "MATCH returns VALUE for an unsupported match_type"
setup = { A1 = 1, A2 = 2, A3 = 3 }
formula = "=MATCH(1,A1:A3,2)"
expect = { error = "#VALUE!" }

[[case]]
id = "FN-MATCH-012"
desc = "MATCH returns VALUE for too few arguments"
setup = {}
formula = "=MATCH(1)"
expect = { error = "#VALUE!" }

[[case]]
id = "FN-MATCH-013"
desc = "MATCH returns VALUE for too many arguments"
setup = { A1 = 1 }
formula = "=MATCH(1,A1:A1,0,1)"
expect = { error = "#VALUE!" }
