[[case]]
id = "FN-YEARFRAC-001"
desc = "YEARFRAC defaults to US 30/360 for the Microsoft documented example"
setup = {}
formula = "=YEARFRAC(DATE(2012,1,1), DATE(2012,7,30))"
expect = { number = 0.5805555555555556 }

[[case]]
id = "FN-YEARFRAC-002"
desc = "YEARFRAC basis 1 returns actual/actual for the Microsoft documented example"
setup = {}
formula = "=YEARFRAC(DATE(2012,1,1), DATE(2012,7,30), 1)"
expect = { number = 0.5765027322404371 }

[[case]]
id = "FN-YEARFRAC-003"
desc = "YEARFRAC basis 3 returns actual/365 for the Microsoft documented example"
setup = {}
formula = "=YEARFRAC(DATE(2012,1,1), DATE(2012,7,30), 3)"
expect = { number = 0.5780821917808219 }

[[case]]
id = "FN-YEARFRAC-004"
desc = "YEARFRAC basis 2 returns actual/360 for the Microsoft documented example"
setup = {}
formula = "=YEARFRAC(DATE(2012,1,1), DATE(2012,7,30), 2)"
expect = { number = 0.5861111111111111 }

[[case]]
id = "FN-YEARFRAC-005"
desc = "YEARFRAC basis 4 returns European 30/360 for the Microsoft documented example"
setup = {}
formula = "=YEARFRAC(DATE(2012,1,1), DATE(2012,7,30), 4)"
expect = { number = 0.5805555555555556 }

[[case]]
id = "FN-YEARFRAC-006"
desc = "YEARFRAC returns zero for the same start and end date"
setup = {}
formula = "=YEARFRAC(DATE(2020,1,31), DATE(2020,1,31), 1)"
expect = { number = 0 }

[[case]]
id = "FN-YEARFRAC-007"
desc = "YEARFRAC returns a negative fraction for reversed dates"
setup = {}
formula = "=YEARFRAC(DATE(2012,7,30), DATE(2012,1,1), 2)"
expect = { number = -0.5861111111111111 }

[[case]]
id = "FN-YEARFRAC-008"
desc = "YEARFRAC truncates the basis argument toward zero"
setup = {}
formula = "=YEARFRAC(DATE(2012,1,1), DATE(2012,7,30), 3.9)"
expect = { number = 0.5780821917808219 }

[[case]]
id = "FN-YEARFRAC-009"
desc = "YEARFRAC returns NUM for an invalid basis"
setup = {}
formula = "=YEARFRAC(DATE(2012,1,1), DATE(2012,7,30), 5)"
expect = { error = "#NUM!" }

[[case]]
id = "FN-YEARFRAC-010"
desc = "YEARFRAC returns VALUE for an invalid date serial"
setup = {}
formula = "=YEARFRAC(0, DATE(2012,7,30), 1)"
expect = { error = "#VALUE!" }

[[case]]
id = "FN-YEARFRAC-011"
desc = "YEARFRAC returns VALUE for date text strings until DATEVALUE parsing exists"
setup = {}
formula = '=YEARFRAC("2012-01-01", DATE(2012,7,30), 1)'
expect = { error = "#VALUE!" }

[[case]]
id = "FN-YEARFRAC-012"
desc = "YEARFRAC basis 1 splits multi-year intervals across a leap year"
setup = {}
formula = "=YEARFRAC(DATE(2019,7,1), DATE(2020,7,1), 1)"
expect = { number = 1.0013773486039375 }

[[case]]
id = "FN-YEARFRAC-013"
desc = "YEARFRAC US 30/360 rolls an end date on the 31st when start day is below 30"
setup = {}
formula = "=YEARFRAC(DATE(2021,1,29), DATE(2021,1,31), 0)"
expect = { number = 0.005555555555555556 }

[[case]]
id = "FN-YEARFRAC-014"
desc = "YEARFRAC European 30/360 adjusts 31st day endpoints"
setup = {}
formula = "=YEARFRAC(DATE(2021,1,31), DATE(2021,3,31), 4)"
expect = { number = 0.16666666666666666 }

[[case]]
id = "FN-YEARFRAC-015"
desc = "YEARFRAC returns VALUE for too few arguments"
setup = {}
formula = "=YEARFRAC(DATE(2020,1,1))"
expect = { error = "#VALUE!" }

[[case]]
id = "FN-YEARFRAC-016"
desc = "YEARFRAC returns VALUE for too many arguments"
setup = {}
formula = "=YEARFRAC(DATE(2020,1,1), DATE(2020,1,2), 1, 0)"
expect = { error = "#VALUE!" }
