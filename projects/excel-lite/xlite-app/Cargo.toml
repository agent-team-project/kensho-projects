[package]
name = "xlite-app"
version = "0.1.0"
description = "Tauri command layer for Excel Lite"
edition = "2021"
license = "MIT"

[lib]
name = "xlite_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.1"
xlite-core = { path = "../xlite-core" }

[dev-dependencies]
zip = { version = "8.6.0", default-features = false }
