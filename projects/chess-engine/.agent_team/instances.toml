# Local-only Kensho topology for the chess engine evaluation.
# PM provider integrations are disabled; jobs live under .agent_team/jobs.

[locks.cargo]
slots = 2
scope = "team"

[channels.supervisor]
scope = "team"

[channels.review]
scope = "team"

[instances.manager]
agent       = "manager"
ephemeral   = false
brief       = true
runtime     = "codex"
runtime_bin = "scripts/codex-chatgpt-only.sh"
description = "Owns the chess-engine benchmark scope, backlog, dispatch, and final local acceptance report."

[[instances.manager.triggers]]
event = "user_invocation"

[[instances.manager.triggers]]
event        = "agent.dispatch"
match.target = "manager"

[instances.worker]
agent         = "worker"
ephemeral     = true
replicas      = 6
runtime       = "codex"
runtime_bin   = "scripts/codex-chatgpt-only.sh"
token_budget  = "45M"
time_budget   = "60m"
env_allow     = ["PATH", "HOME", "USER", "LOGNAME", "SHELL", "TMPDIR", "TERM", "TERM_PROGRAM", "LANG", "LC_*", "XDG_*", "CODEX_HOME", "RUSTUP_HOME", "CARGO_HOME", "SSH_AUTH_SOCK"]
description   = "Implements one local backlog issue in an isolated worktree and records validation evidence."

[[instances.worker.triggers]]
event        = "agent.dispatch"
match.target = "worker"

[instances.reviewer]
agent        = "reviewer"
ephemeral    = true
replicas     = 3
runtime      = "codex"
runtime_bin  = "scripts/codex-chatgpt-only.sh"
token_budget = "12M"
time_budget  = "35m"
env_allow    = ["PATH", "HOME", "USER", "LOGNAME", "SHELL", "TMPDIR", "TERM", "TERM_PROGRAM", "LANG", "LC_*", "XDG_*", "CODEX_HOME", "RUSTUP_HOME", "CARGO_HOME", "SSH_AUTH_SOCK"]
description  = "Adversarial local reviewer. Verifies diffs and gates against SPEC.md; never edits implementation files."

[[instances.reviewer.triggers]]
event        = "agent.dispatch"
match.target = "reviewer"

[instances.auditor]
agent        = "auditor"
ephemeral    = true
replicas     = 1
runtime      = "codex"
runtime_bin  = "scripts/codex-chatgpt-only.sh"
token_budget = "12M"
time_budget  = "35m"
env_allow    = ["PATH", "HOME", "USER", "LOGNAME", "SHELL", "TMPDIR", "TERM", "TERM_PROGRAM", "LANG", "LC_*", "XDG_*", "CODEX_HOME", "RUSTUP_HOME", "CARGO_HOME", "SSH_AUTH_SOCK"]
description  = "Audits one subsystem or acceptance gate and files at most three local backlog findings."

[[instances.auditor.triggers]]
event        = "agent.dispatch"
match.target = "auditor"

[pipelines.local_slice]
trigger.event = "chess.slice.ready"
auto_advance  = true
redispatch_on_reentry = false

[pipelines.local_slice.infra_signatures]
cargo_registry_lock = "Blocking waiting for file lock on package cache"
missing_rust = "rustc: command not found|cargo: command not found"

[[pipelines.local_slice.steps]]
id           = "implement"
target       = "worker"
workspace    = "worktree"
timeout      = "60m"
token_budget = "45M"
time_budget  = "60m"
locks        = ["cargo"]
max_attempts = 1
instructions = """
Implement exactly one backlog issue against SPEC.md. Keep the slice small,
add or update objective tests, run the strongest local validation available,
commit the work locally, and record the branch/worktree when marking the step
done. Do not use hosted PM tools or runtime network services.
"""

[[pipelines.local_slice.steps]]
id             = "review"
target         = "reviewer"
after          = ["implement"]
workspace      = "repo"
timeout        = "35m"
token_budget   = "12M"
time_budget    = "35m"
retry_on_crash = true
max_attempts   = 1
instructions = """
Review the worker branch against the issue and SPEC.md. Run relevant local
commands. Reject regressions in perft, UCI, tests, module boundaries, or
local-only constraints. Record pass/fail with `agent-team job gate set`, then
mark the review step done and advance to the manager approval gate.
"""

[[pipelines.local_slice.steps]]
id           = "approve"
target       = "manager"
after        = ["review"]
workspace    = "repo"
gate         = "manual"
instructions = """
Read the reviewer verdict, gate ledger, diff, and validation evidence. If the
slice is acceptable, merge or leave a clear human-ready merge instruction. If it
is not acceptable, bounce the job with concrete findings. Never paper over a
failed objective gate.
"""

[schedules.weekly-audit]
every = "168h"

[schedules.weekly-audit.payload]
kind = "acceptance_audit"

[[instances.auditor.triggers]]
event      = "schedule"
match.name = "weekly-audit"
match.kind = "acceptance_audit"

[teams.chess]
description = "Local chess-engine implementation and evaluation team."
instances   = ["manager", "worker", "reviewer", "auditor"]
pipelines   = ["local_slice"]
schedules   = ["weekly-audit"]
channels    = ["supervisor", "review"]
