schema_version: 1
contract: workplane-operation-permissions
source_of_truth: true
default: deny

operations:
  "POST /api/v1/session/login": [session.login]
  "POST /api/v1/session/logout": [session.logout]
  "GET /api/v1/session": [session.read]
  "GET /api/v1/sessions": [session.read]
  "DELETE /api/v1/sessions/{session_id}": [session.revoke]
  "GET /api/v1/orgs/{org_id}": [org.read]
  "PATCH /api/v1/orgs/{org_id}": [org.manage]
  "DELETE /api/v1/orgs/{org_id}": [org.delete]
  "GET /api/v1/orgs/{org_id}/members": [membership.read]
  "POST /api/v1/orgs/{org_id}/members": [membership.manage]
  "PATCH /api/v1/orgs/{org_id}/members/{actor_id}": [membership.manage]
  "GET /api/v1/orgs/{org_id}/audit": [audit.read]
  "GET /api/v1/orgs/{org_id}/service-identities": [service_identity.read]
  "POST /api/v1/orgs/{org_id}/service-identities": [service_identity.manage]
  "PATCH /api/v1/orgs/{org_id}/service-identities/{id}": [service_identity.manage]
  "POST /api/v1/orgs/{org_id}/service-identities/{id}/tokens": [token.issue]
  "GET /api/v1/orgs/{org_id}/service-identities/{id}/tokens": [token.read]
  "DELETE /api/v1/orgs/{org_id}/service-identities/{id}/tokens/{token_id}": [token.revoke]
  "GET /api/v1/orgs/{org_id}/portfolios": [portfolio.read]
  "POST /api/v1/orgs/{org_id}/portfolios": [portfolio.manage]
  "GET /api/v1/portfolios/{portfolio_id}": [portfolio.read]
  "PATCH /api/v1/portfolios/{portfolio_id}": [portfolio.manage]
  "GET /api/v1/portfolios/{portfolio_id}/projects": [portfolio.read]
  "POST /api/v1/portfolios/{portfolio_id}/rank": [priority.decide, decision.record]
  "GET /api/v1/portfolios/{portfolio_id}/timeline": [portfolio.read]
  "GET /api/v1/portfolios/{portfolio_id}/capacity": [portfolio.read]
  "GET /api/v1/orgs/{org_id}/projects": [project.read]
  "POST /api/v1/orgs/{org_id}/projects": [project.create]
  "GET /api/v1/projects/{project_id}": [project.read]
  "PATCH /api/v1/projects/{project_id}": [project.edit]
  "POST /api/v1/projects/{project_id}/activate": [project.activate]
  "POST /api/v1/projects/{project_id}/hold": [project.hold, decision.record]
  "POST /api/v1/projects/{project_id}/resume": [project.resume, decision.record]
  "POST /api/v1/projects/{project_id}/promote": [project.promote, decision.record]
  "POST /api/v1/projects/{project_id}/complete": [project.complete, decision.record]
  "POST /api/v1/projects/{project_id}/stop": [project.stop, decision.record]
  "POST /api/v1/projects/{project_id}/cancel": [project.cancel, decision.record]
  "GET /api/v1/projects/{project_id}/activity": [project.read]
  "GET /api/v1/projects/{project_id}/health": [project.read]
  "GET /api/v1/projects/{project_id}/context-brief": [project.read]
  "GET /api/v1/projects/{project_id}/forecasts": [project.read]
  "POST /api/v1/projects/{project_id}/forecasts": [project.reforecast]
  "GET /api/v1/deliverables/{deliverable_id}/forecasts": [deliverable.read]
  "POST /api/v1/deliverables/{deliverable_id}/forecasts": [deliverable.reforecast]
  "POST /api/v1/projects/{project_id}/target": [project.target.write]
  "POST /api/v1/projects/{project_id}/deadline": [project.deadline.write]
  "GET /api/v1/projects/{project_id}/hypotheses": [hypothesis.read]
  "POST /api/v1/projects/{project_id}/hypotheses": [hypothesis.write]
  "POST /api/v1/hypotheses/{id}/supersede": [hypothesis.write]
  "GET /api/v1/projects/{project_id}/experiments": [experiment.read]
  "POST /api/v1/projects/{project_id}/experiments": [experiment.write]
  "PATCH /api/v1/experiments/{id}": [experiment.write]
  "POST /api/v1/experiments/{id}/observations": [observation.create]
  "POST /api/v1/projects/{project_id}/decisions/continue": [decision.record]
  "POST /api/v1/projects/{project_id}/decisions/pivot": [decision.record, hypothesis.write]
  "GET /api/v1/projects/{project_id}/deliverables": [deliverable.read]
  "POST /api/v1/projects/{project_id}/deliverables": [deliverable.edit]
  "GET /api/v1/deliverables/{id}": [deliverable.read]
  "PATCH /api/v1/deliverables/{id}": [deliverable.edit]
  "POST /api/v1/deliverables/{id}/criteria": [deliverable.edit]
  "POST /api/v1/deliverables/{id}/gates": [deliverable.edit]
  "POST /api/v1/deliverables/{id}/submit": [deliverable.submit, review.request]
  "POST /api/v1/deliverables/{id}/waive": [deliverable.waive, decision.record]
  "POST /api/v1/deliverables/{id}/cancel": [deliverable.cancel, decision.record]
  "POST /api/v1/projects/{project_id}/evidence": [evidence.create]
  "GET /api/v1/projects/{project_id}/evidence": [evidence.read]
  "POST /api/v1/evidence/{id}/supersede": [evidence.supersede]
  "POST /api/v1/gates/{gate_id}/verdicts": [review.verdict]
  "POST /api/v1/gates/{gate_id}/waive": [gate.soft_waive, decision.record]
  "GET /api/v1/gates/{gate_id}/verdicts": [deliverable.read]
  "POST /api/v1/findings/{finding_id}/resolve": [finding.resolve]
  "POST /api/v1/findings/{finding_id}/withdraw": [finding.withdraw]
  "GET /api/v1/projects/{project_id}/work-items": [work.read]
  "POST /api/v1/projects/{project_id}/work-items": [work.edit]
  "GET /api/v1/work-items/{id}": [work.read]
  "PATCH /api/v1/work-items/{id}": [work.edit]
  "POST /api/v1/work-items/{id}/transition": [work.transition]
  "POST /api/v1/work-items/{id}/assign": [work.assign]
  "POST /api/v1/work-items/{id}/dependencies": [dependency.edit]
  "DELETE /api/v1/work-items/{id}/dependencies/{dependency_id}": [dependency.edit]
  "POST /api/v1/projects/{project_id}/work-items/batch-transition": [work.transition]
  "GET /api/v1/projects/{project_id}/dependency-graph": [dependency.read]
  "GET /api/v1/projects/{project_id}/decisions": [decision.read]
  "POST /api/v1/projects/{project_id}/decisions": [decision.record]
  "POST /api/v1/decisions/{id}/supersede": [decision.record]
  "GET /api/v1/{resource_type}/{resource_id}/comments": [comment.read]
  "POST /api/v1/{resource_type}/{resource_id}/comments": [comment.create]
  "PATCH /api/v1/comments/{id}": [comment.edit]
  "GET /api/v1/inbox": [inbox.read]
  "POST /api/v1/inbox/{item_id}/ack": [inbox.ack]
  "POST /api/v1/inbox/ack-batch": [inbox.ack]
  "GET /api/v1/judgment-queue": [judgment.read]
  "POST /api/v1/judgment-queue/{item_id}/claim": [judgment.claim]
  "POST /api/v1/judgment-queue/{item_id}/resolve": [judgment.resolve]
  "GET /api/v1/projects/{project_id}/brief/metadata": [brief.read]
  "GET /api/v1/projects/{project_id}/brief/sections": [brief.read]
  "PATCH /api/v1/projects/{project_id}/brief/sections/{section_id}": [brief.write]
  "GET /api/v1/projects/{project_id}/brief/revisions": [brief.read]
  "GET /api/v1/projects/{project_id}/brief/snapshots": [brief.read]
  "POST /api/v1/projects/{project_id}/brief/snapshots": [brief.write]
  "POST /api/v1/projects/{project_id}/brief/restore": [brief.restore]
  "GET /api/v1/projects/{project_id}/brief/export": [brief.export]
  "POST /api/v1/projects/{project_id}/brief/apply": [brief.write]
  "POST /api/v1/projects/{project_id}/brief/grant": [brief.grant]
  "GET /api/v1/search?q=...&types=project,decision,evidence&portfolio_id=...": [search.read]
  "GET /api/v1/orgs/{org_id}/rules": [automation.read]
  "POST /api/v1/orgs/{org_id}/rules": [automation.manage]
  "GET /api/v1/rules/{id}": [automation.read]
  "PATCH /api/v1/rules/{id}": [automation.manage]
  "POST /api/v1/rules/{id}/dry-run": [automation.manage]
  "POST /api/v1/rules/{id}/enable": [automation.manage]
  "POST /api/v1/rules/{id}/disable": [automation.manage]
  "GET /api/v1/rules/{id}/executions": [automation.read]
  "POST /api/v1/rule-executions/{id}/retry": [automation.retry]
  "GET /api/v1/realtime?cursor=<opaque>": [realtime.subscribe]
  "GET /api/v1/events?cursor=<opaque>&types=review.requested,work_item.assigned": [event.subscribe]
  "POST /api/v1/orgs/{org_id}/exports": [export.create]
  "GET /api/v1/exports/{id}": [export.download]
  "GET /api/v1/projects/{project_id}/research-metrics": [research.read]
  "GET /api/v1/portfolios/{portfolio_id}/research-metrics": [research.read]

contextual_checks:
  comments: parent_resource_must_be_readable_or_commentable_for_the_requested_action
  search: every_result_count_facet_and_snippet_must_pass_resource_read_policy
  judgment_resolve: underlying_decision_or_review_actions_are_also_required
  risk_acceptance_decision: risk.accept_is_required_in_addition_to_decision.record
  brief_grant: requested_read_write_comment_scope_is_intersected_with_current_brief_actions

contextual_action_usage:
  brief.comment: comment_operations_when_parent_is_brief
  risk.accept: decision_record_when_kind_is_risk-acceptance

coverage_rule: every_OpenAPI_operation_has_exactly_one_entry_and_every_referenced_action_exists_in_permissions.yaml
