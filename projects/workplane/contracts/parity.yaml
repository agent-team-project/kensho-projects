schema_version: 1
contract: workplane-human-agent-parity
default: fail_unmapped

principles:
  - every_authoritative_ui_mutation_uses_public_api
  - equivalent_scope_produces_equivalent_domain_result_and_event_group
  - no_authoritative_state_exists_only_in_browser_or_agent_private_files
  - machine_only_operations_require_written_rationale

columns:
  required:
    - capability_id
    - requirement_id
    - public_operation_id
    - ui_surface
    - agent_example
    - permission_action
    - parity_case_id
    - status

seed_capabilities:
  - capability_id: create-project
    requirement_id: PR-CORE-01
    public_operation_id: createProject
    ui_surface: project-create-dialog
    agent_example: web/src/workflow.ts#runAgentWalkingSlice
    permission_action: project.create
    parity_case_id: PARITY-PROJECT-001
    status: implemented
  - capability_id: record-decision
    requirement_id: PR-DEC-01
    public_operation_id: recordDecision
    ui_surface: judgment-decision-sheet
    agent_example: web/src/workflow.ts#runAgentWalkingSlice
    permission_action: decision.record
    parity_case_id: PARITY-DECISION-001
    status: implemented
  - capability_id: reforecast-project
    requirement_id: PR-FC-01
    public_operation_id: reforecastProject
    ui_surface: forecast-dialog
    agent_example: examples/agent/reforecast
    permission_action: project.reforecast
    parity_case_id: PARITY-FORECAST-001
    status: implemented
  - capability_id: lifecycle-project
    requirement_id: M2C-LIFECYCLE-001
    public_operation_id: activateProject|holdProject|resumeProject|promoteProject
    ui_surface: headless-m2c-contract-no-track-c-ui
    agent_example: web/src/planning.ts#runAgentPlanningSlice
    permission_action: project.activate
    parity_case_id: M2C-PARITY-001
    status: implemented
  - capability_id: edit-deliverable
    requirement_id: M2C-DELIVERABLE-001
    public_operation_id: createDeliverable|reviseDeliverable
    ui_surface: headless-m2c-contract-no-track-c-ui
    agent_example: web/src/planning.ts#runAgentPlanningSlice
    permission_action: deliverable.edit
    parity_case_id: M2C-PARITY-001
    status: implemented
  - capability_id: reforecast-deliverable
    requirement_id: M2C-FORECAST-001
    public_operation_id: reforecastDeliverable
    ui_surface: headless-m2c-contract-no-track-c-ui
    agent_example: web/src/planning.ts#runAgentPlanningSlice
    permission_action: deliverable.reforecast
    parity_case_id: M2C-PARITY-001
    status: implemented
  - capability_id: apply-brief-section
    requirement_id: PR-BRIEF-01
    public_operation_id: applyBriefSection
    ui_surface: brief-editor
    agent_example: examples/agent/apply-brief-section
    permission_action: brief.write
    parity_case_id: PARITY-BRIEF-001
    status: specified
  - capability_id: submit-deliverable
    requirement_id: M2D-REVIEW-001
    public_operation_id: submitDeliverable|resubmitDeliverable
    ui_surface: headless-m2d-contract-no-track-c-ui
    agent_example: web/src/api/client.gen.ts#submitDeliverable
    permission_action: deliverable.submit
    parity_case_id: M2D-PARITY-001
    status: implemented
  - capability_id: cancel-optional-deliverable
    requirement_id: M2D-REVIEW-001
    public_operation_id: cancelDeliverable
    ui_surface: headless-m2d-contract-no-track-c-ui
    agent_example: web/src/api/client.gen.ts#cancelDeliverable
    permission_action: deliverable.cancel
    parity_case_id: M2D-PARITY-001
    status: implemented
  - capability_id: create-and-supersede-evidence
    requirement_id: M2D-EVIDENCE-001
    public_operation_id: createEvidence|supersedeEvidence
    ui_surface: headless-m2d-contract-no-track-c-ui
    agent_example: web/src/api/client.gen.ts#createEvidence
    permission_action: evidence.create
    parity_case_id: M2D-PARITY-001
    status: implemented
  - capability_id: review-deliverable
    requirement_id: M2D-GATE-001
    public_operation_id: createGate|recordVerdict|bounceDeliverable|approveDeliverable
    ui_surface: headless-m2d-contract-no-track-c-ui
    agent_example: web/src/api/client.gen.ts#recordVerdict
    permission_action: review.verdict
    parity_case_id: M2D-PARITY-001
    status: implemented
  - capability_id: resolve-review-finding
    requirement_id: M2D-REVIEW-001
    public_operation_id: resolveFinding|withdrawFinding
    ui_surface: headless-m2d-contract-no-track-c-ui
    agent_example: web/src/api/client.gen.ts#resolveFinding
    permission_action: finding.resolve
    parity_case_id: M2D-PARITY-001
    status: implemented
  - capability_id: human-policy-waiver
    requirement_id: M2D-SEPARATION-001
    public_operation_id: waiveGate|waiveDeliverable
    ui_surface: headless-m2d-contract-no-track-c-ui
    agent_example: web/src/api/client.gen.ts#waiveGate-expected-human-required-deny
    permission_action: gate.soft_waive
    parity_case_id: M2D-PARITY-001
    status: implemented
  - capability_id: manage-work-items
    requirement_id: M2E-CONTRACT-001
    public_operation_id: createWorkItem|listWorkItems|getWorkItem|updateWorkItem
    ui_surface: headless-m2e-contract-no-track-c-ui
    agent_example: web/src/api/client.gen.ts#createWorkItem
    permission_action: work.edit
    parity_case_id: M2E-AUTHORITY-001
    status: implemented
  - capability_id: assign-and-transition-work
    requirement_id: M2E-LIFECYCLE-001
    public_operation_id: assignWorkItem|transitionWorkItem|batchTransitionWorkItems
    ui_surface: headless-m2e-contract-no-track-c-ui
    agent_example: web/src/api/client.gen.ts#transitionWorkItem
    permission_action: work.transition
    parity_case_id: M2E-AUTHORITY-001
    status: implemented
  - capability_id: edit-work-dependencies
    requirement_id: M2E-DEPENDENCY-001
    public_operation_id: addWorkItemDependency|removeWorkItemDependency
    ui_surface: headless-m2e-contract-no-track-c-ui
    agent_example: web/src/api/client.gen.ts#addWorkItemDependency
    permission_action: dependency.edit
    parity_case_id: M2E-AUTHORITY-001
    status: implemented
  - capability_id: read-dependency-graph
    requirement_id: M2E-DEPENDENCY-001
    public_operation_id: getDependencyGraph
    ui_surface: headless-m2e-contract-no-track-c-ui
    agent_example: web/src/api/client.gen.ts#getDependencyGraph
    permission_action: dependency.read
    parity_case_id: M2E-AUTHORITY-001
    status: implemented

ci_failures:
  - ui_mutation_without_operation
  - operation_without_permission_action
  - agent_essential_operation_without_example
  - equivalent_actor_results_diverge
  - private_endpoint_or_direct_database_mutation
  - undocumented_machine_only_capability
