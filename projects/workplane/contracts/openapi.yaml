openapi: 3.1.0
x-request-body-max-bytes: 65536
info:
  title: Workplane Work and Dependency API
  version: 0.7.0-m2e
  description: Executable M1/M2 durable behavior plus the M2E fixed work-item lifecycle and typed dependency graph.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/session/login:
    post:
      operationId: login
      security: []
      x-permission-actions: [session.login]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Authenticated human session
          headers:
            Set-Cookie:
              description: >-
                Issues the HttpOnly workplane_session credential. Secure is
                required outside explicit localhost development; Path=/ and
                SameSite=Lax are always required.
              required: true
              schema:
                type: string
                pattern: '^workplane_session=[^;]+; Path=/; HttpOnly; SameSite=Lax(?:; Secure)?$'
                examples:
                  - 'workplane_session=opaque; Path=/; HttpOnly; SameSite=Lax; Secure'
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/orgs/{org_id}/projects:
    parameters:
      - {$ref: '#/components/parameters/OrgId'}
    post:
      operationId: createProject
      description: >-
        Creates an organization-level exploration project. An agent bearer may
        call this operation only when its project allowlist is empty; any
        nonempty project restriction denies creation because no existing
        project can be the operation target.
      security:
        - HumanSession: []
          CsrfToken: []
        - AgentBearer: []
      x-permission-actions: [project.create]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateExplorationProject'}
      responses:
        '201':
          description: Exploration project created
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/projects/{project_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      operationId: getProject
      security:
        - HumanSession: []
        - AgentBearer: []
      x-permission-actions: [project.read]
      responses:
        '200':
          description: Project projection
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/projects/{project_id}/activate:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    post:
      operationId: activateProject
      security: &mutationSecurity
        - HumanSession: []
          CsrfToken: []
        - AgentBearer: []
      x-permission-actions: [project.activate]
      parameters: &versionedMutationParameters
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/ExpectedVersion'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LifecycleReasonRequest'}
      responses:
        '200': &versionedProjectResponse
          description: Committed project projection
          headers:
            ETag: {$ref: '#/components/headers/VersionETag'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/projects/{project_id}/hold:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    post:
      operationId: holdProject
      security: *mutationSecurity
      x-permission-actions: [project.hold, decision.record]
      parameters: *versionedMutationParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LifecycleReasonRequest'}
      responses:
        '200': *versionedProjectResponse
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/projects/{project_id}/resume:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    post:
      operationId: resumeProject
      security: *mutationSecurity
      x-permission-actions: [project.resume, decision.record]
      parameters: *versionedMutationParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LifecycleReasonRequest'}
      responses:
        '200': *versionedProjectResponse
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/projects/{project_id}/promote:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    post:
      operationId: promoteProject
      security: *mutationSecurity
      x-permission-actions: [project.promote, decision.record]
      parameters: *versionedMutationParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PromoteProjectRequest'}
      responses:
        '200':
          description: Atomic promotion result
          headers:
            ETag: {$ref: '#/components/headers/VersionETag'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PromotionResult'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/projects/{project_id}/deliverables:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      operationId: listDeliverables
      security: &readSecurity
        - HumanSession: []
        - AgentBearer: []
      x-permission-actions: [deliverable.read]
      responses:
        '200':
          description: Stable deliverable projections
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Deliverable'}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createDeliverable
      security: *mutationSecurity
      x-permission-actions: [deliverable.edit]
      parameters: *versionedMutationParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeliverableInput'}
      responses:
        '201': &versionedDeliverableResponse
          description: Committed deliverable projection
          headers:
            ETag: {$ref: '#/components/headers/VersionETag'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deliverable'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/deliverables/{id}:
    parameters: [{$ref: '#/components/parameters/DeliverableId'}]
    get:
      operationId: getDeliverable
      security: *readSecurity
      x-permission-actions: [deliverable.read]
      responses:
        '200':
          description: Deliverable projection
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deliverable'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: reviseDeliverable
      security: *mutationSecurity
      x-permission-actions: [deliverable.edit]
      parameters: *versionedMutationParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeliverableInput'}
      responses:
        '200': *versionedDeliverableResponse
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/projects/{project_id}/evidence:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      operationId: listEvidence
      security: *readSecurity
      x-permission-actions: [evidence.read]
      responses:
        '200':
          description: Immutable attributable project evidence in stable chain order
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Evidence'}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createEvidence
      security: *mutationSecurity
      x-permission-actions: [evidence.create]
      parameters: *versionedMutationParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EvidenceInput'}
      responses:
        '201': &versionedEvidenceResponse
          description: Immutable attributable evidence
          headers:
            ETag: {$ref: '#/components/headers/VersionETag'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Evidence'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/evidence/{id}/supersede:
    parameters: [{$ref: '#/components/parameters/EvidenceId'}]
    post:
      operationId: supersedeEvidence
      security: *mutationSecurity
      x-permission-actions: [evidence.supersede]
      parameters: *versionedMutationParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EvidenceInput'}
      responses:
        '201': *versionedEvidenceResponse
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/deliverables/{id}/gates:
    parameters: [{$ref: '#/components/parameters/DeliverableId'}]
    get:
      operationId: listGates
      security: *readSecurity
      x-permission-actions: [deliverable.read]
      responses:
        '200':
          description: Stable current gate projections with immutable verdict history available separately
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Gate'}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createGate
      security: *mutationSecurity
      x-permission-actions: [deliverable.edit]
      parameters: *versionedMutationParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GateInput'}
      responses:
        '201': &versionedGateResponse
          description: Stable evidence gate
          headers:
            ETag: {$ref: '#/components/headers/VersionETag'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Gate'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/gates/{gate_id}/verdicts:
    parameters: [{$ref: '#/components/parameters/GateId'}]
    get:
      operationId: listVerdicts
      security: *readSecurity
      x-permission-actions: [deliverable.read]
      responses:
        '200':
          description: Immutable attributable verdict history
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Verdict'}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: recordVerdict
      security: *mutationSecurity
      x-permission-actions: [review.verdict]
      parameters: *versionedMutationParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VerdictInput'}
      responses:
        '201':
          description: Atomic gate, verdict, and actionable-finding result
          headers:
            ETag: {$ref: '#/components/headers/VersionETag'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VerdictResult'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/deliverables/{id}/findings:
    parameters: [{$ref: '#/components/parameters/DeliverableId'}]
    get:
      operationId: listFindings
      security: *readSecurity
      x-permission-actions: [deliverable.read]
      responses:
        '200':
          description: Current finding projections retaining immutable origin and disposition history
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Finding'}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/findings/{finding_id}/resolve:
    parameters: [{$ref: '#/components/parameters/FindingId'}]
    post:
      operationId: resolveFinding
      security: *mutationSecurity
      x-permission-actions: [finding.resolve]
      parameters: *versionedMutationParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FindingDispositionInput'}
      responses:
        '200': &versionedFindingActionResponse
          description: Atomic attributable finding disposition
          headers:
            ETag: {$ref: '#/components/headers/VersionETag'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FindingActionResult'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/findings/{finding_id}/withdraw:
    parameters: [{$ref: '#/components/parameters/FindingId'}]
    post:
      operationId: withdrawFinding
      security: *mutationSecurity
      x-permission-actions: [finding.withdraw]
      parameters: *versionedMutationParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FindingDispositionInput'}
      responses:
        '200': *versionedFindingActionResponse
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/deliverables/{id}/submit:
    parameters: [{$ref: '#/components/parameters/DeliverableId'}]
    post:
      operationId: submitDeliverable
      security: *mutationSecurity
      x-permission-actions: [deliverable.submit, review.request]
      parameters: *versionedMutationParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmissionInput'}
      responses:
        '200': &versionedSubmissionResponse
          description: Committed deliverable and immutable submission record
          headers:
            ETag: {$ref: '#/components/headers/VersionETag'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubmissionResult'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/deliverables/{id}/bounce:
    parameters: [{$ref: '#/components/parameters/DeliverableId'}]
    post:
      operationId: bounceDeliverable
      security: *mutationSecurity
      x-permission-actions: [review.verdict]
      parameters: *versionedMutationParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BounceInput'}
      responses:
        '200': *versionedDeliverableResponse
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/deliverables/{id}/resubmit:
    parameters: [{$ref: '#/components/parameters/DeliverableId'}]
    post:
      operationId: resubmitDeliverable
      security: *mutationSecurity
      x-permission-actions: [deliverable.submit, review.request]
      parameters: *versionedMutationParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmissionInput'}
      responses:
        '200': *versionedSubmissionResponse
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/deliverables/{id}/approve:
    parameters: [{$ref: '#/components/parameters/DeliverableId'}]
    post:
      operationId: approveDeliverable
      security: *mutationSecurity
      x-permission-actions: [review.verdict]
      parameters: *versionedMutationParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewNoteInput'}
      responses:
        '200': *versionedDeliverableResponse
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/deliverables/{id}/cancel:
    parameters: [{$ref: '#/components/parameters/DeliverableId'}]
    post:
      operationId: cancelDeliverable
      security: *mutationSecurity
      x-permission-actions: [deliverable.cancel, decision.record]
      parameters: *versionedMutationParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LifecycleReasonRequest'}
      responses:
        '200': *versionedDeliverableResponse
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/deliverables/{id}/waive:
    parameters: [{$ref: '#/components/parameters/DeliverableId'}]
    post:
      operationId: waiveDeliverable
      security: *mutationSecurity
      x-permission-actions: [deliverable.waive, decision.record]
      parameters: *versionedMutationParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WaiverInput'}
      responses:
        '200':
          description: Atomic human-only deliverable waiver and universal decision
          headers:
            ETag: {$ref: '#/components/headers/VersionETag'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliverableWaiverResult'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/gates/{gate_id}/waive:
    parameters: [{$ref: '#/components/parameters/GateId'}]
    post:
      operationId: waiveGate
      security: *mutationSecurity
      x-permission-actions: [gate.soft_waive, decision.record]
      parameters: *versionedMutationParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WaiverInput'}
      responses:
        '200':
          description: Atomic human-only soft-gate waiver and universal decision
          headers:
            ETag: {$ref: '#/components/headers/VersionETag'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GateWaiverResult'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/projects/{project_id}/forecasts:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      operationId: listProjectForecasts
      security: *readSecurity
      x-permission-actions: [project.read]
      responses:
        '200': &forecastHistoryResponse
          description: Immutable forecast history with current and stale projection flags
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Forecast'}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: reforecastProject
      security: *mutationSecurity
      x-permission-actions: [project.reforecast]
      parameters: *versionedMutationParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForecastInput'}
      responses:
        '201': &versionedForecastResponse
          description: Immutable current forecast
          headers:
            ETag: {$ref: '#/components/headers/VersionETag'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Forecast'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/deliverables/{deliverable_id}/forecasts:
    parameters: [{$ref: '#/components/parameters/DeliverableForecastId'}]
    get:
      operationId: listDeliverableForecasts
      security: *readSecurity
      x-permission-actions: [deliverable.read]
      responses:
        '200': *forecastHistoryResponse
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: reforecastDeliverable
      security: *mutationSecurity
      x-permission-actions: [deliverable.reforecast]
      parameters: *versionedMutationParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForecastInput'}
      responses:
        '201': *versionedForecastResponse
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/projects/{project_id}/target:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    post:
      operationId: setProjectTarget
      security: *mutationSecurity
      x-permission-actions: [project.target.write]
      parameters: *versionedMutationParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TargetInput'}
      responses:
        '201': &versionedTargetResponse
          description: Immutable current intent target
          headers:
            ETag: {$ref: '#/components/headers/VersionETag'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Target'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/projects/{project_id}/deadline:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    post:
      operationId: setProjectDeadline
      security: *mutationSecurity
      x-permission-actions: [project.deadline.write]
      parameters: *versionedMutationParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeadlineInput'}
      responses:
        '201':
          description: Immutable current typed deadline
          headers:
            ETag: {$ref: '#/components/headers/VersionETag'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deadline'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/projects/{project_id}/decisions:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    post:
      operationId: recordDecision
      security:
        - HumanSession: []
          CsrfToken: []
        - AgentBearer: []
      x-permission-actions: [decision.record]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/ExpectedVersion'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordDecision'}
      responses:
        '201':
          description: Decision recorded
          headers:
            ETag:
              description: Quoted aggregate version returned by the committed mutation.
              required: true
              schema: {$ref: '#/components/schemas/VersionETag'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Decision'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/projects/{project_id}/work-items:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      operationId: listWorkItems
      security: *readSecurity
      x-permission-actions: [work.read]
      responses:
        '200':
          description: Authorized work-item projections with derived blocking
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/WorkItem'}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createWorkItem
      security: *mutationSecurity
      x-permission-actions: [work.edit]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkItemCreateInput'}
      responses:
        '201': &versionedWorkItemResponse
          description: Committed work-item projection with derived blocking
          headers:
            ETag: {$ref: '#/components/headers/VersionETag'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkItem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/work-items/{id}:
    parameters: [{$ref: '#/components/parameters/WorkItemId'}]
    get:
      operationId: getWorkItem
      security: *readSecurity
      x-permission-actions: [work.read]
      responses:
        '200':
          description: Authorized work-item projection with derived blocking
          headers:
            ETag: {$ref: '#/components/headers/VersionETag'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkItem'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateWorkItem
      security: *mutationSecurity
      x-permission-actions: [work.edit]
      parameters: *versionedMutationParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkItemUpdateInput'}
      responses:
        '200': *versionedWorkItemResponse
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/work-items/{id}/assign:
    parameters: [{$ref: '#/components/parameters/WorkItemId'}]
    post:
      operationId: assignWorkItem
      security: *mutationSecurity
      x-permission-actions: [work.assign]
      parameters: *versionedMutationParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkItemAssignInput'}
      responses:
        '200': *versionedWorkItemResponse
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/work-items/{id}/transition:
    parameters: [{$ref: '#/components/parameters/WorkItemId'}]
    post:
      operationId: transitionWorkItem
      security: *mutationSecurity
      x-permission-actions: [work.transition]
      parameters: *versionedMutationParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkItemTransitionInput'}
      responses:
        '200': *versionedWorkItemResponse
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/work-items/{id}/dependencies:
    parameters: [{$ref: '#/components/parameters/WorkItemId'}]
    post:
      operationId: addWorkItemDependency
      security: *mutationSecurity
      x-permission-actions: [dependency.edit]
      parameters: *versionedMutationParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DependencyAddInput'}
      responses:
        '201': &versionedDependencyMutationResponse
          description: Atomic dependency mutation and refreshed source projection
          headers:
            ETag: {$ref: '#/components/headers/VersionETag'}
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DependencyMutationResult'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/work-items/{id}/dependencies/{dependency_id}:
    parameters:
      - {$ref: '#/components/parameters/WorkItemId'}
      - {$ref: '#/components/parameters/DependencyId'}
    delete:
      operationId: removeWorkItemDependency
      security: *mutationSecurity
      x-permission-actions: [dependency.edit]
      parameters: *versionedMutationParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DependencyRemoveInput'}
      responses:
        '200': *versionedDependencyMutationResponse
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/projects/{project_id}/work-items/batch-transition:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    post:
      operationId: batchTransitionWorkItems
      security: *mutationSecurity
      x-permission-actions: [work.transition]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkItemBatchTransitionInput'}
      responses:
        '200':
          description: All requested item transitions committed atomically
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkItemBatchTransitionResult'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/projects/{project_id}/dependency-graph:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      operationId: getDependencyGraph
      security: *readSecurity
      x-permission-actions: [dependency.read]
      responses:
        '200':
          description: Authorized same-organization graph slice with private-project edges omitted
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DependencyGraph'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/projects/{project_id}/activity:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      operationId: listProjectActivity
      security:
        - HumanSession: []
        - AgentBearer: []
      x-permission-actions: [project.read]
      responses:
        '200':
          description: Immutable activity entries
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Activity'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/realtime:
    get:
      operationId: subscribeRealtime
      x-codegen: manual-stream
      x-permission-actions: [realtime.subscribe]
      description: >-
        Upgrades to the workplane.v1 WebSocket subprotocol and emits only
        checkpointed canonical outbox envelopes authorized for the live actor.
      security:
        - HumanSession: []
        - AgentBearer: []
      parameters:
        - {$ref: '#/components/parameters/RealtimeCursor'}
        - {$ref: '#/components/parameters/EventTypes'}
        - name: Sec-WebSocket-Protocol
          in: header
          required: true
          schema: {type: string, const: workplane.v1}
      responses:
        '101':
          description: WebSocket upgraded; frames are ready, event, heartbeat, permission_changed, rate_limited, snapshot_required, or error.
        '409': {$ref: '#/components/responses/SnapshotRequired'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/events:
    get:
      operationId: subscribeAgentEvents
      x-codegen: manual-stream
      x-agent-only: true
      x-permission-actions: [event.subscribe]
      description: >-
        Streams the same checkpointed canonical event envelopes as the
        organization WebSocket, restricted by the current agent delegation.
      security:
        - AgentBearer: []
      parameters:
        - {$ref: '#/components/parameters/RealtimeCursor'}
        - {$ref: '#/components/parameters/EventTypes'}
        - name: Last-Event-ID
          in: header
          required: false
          schema: {type: string, minLength: 1, maxLength: 2048}
      responses:
        '200':
          description: Server-sent canonical domain event envelopes with signed cursor ids.
          content:
            text/event-stream:
              schema: {type: string}
        '409': {$ref: '#/components/responses/SnapshotRequired'}
        default: {$ref: '#/components/responses/Problem'}
components:
  headers:
    RequestId:
      description: Server-generated identifier for the request and committed command.
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    VersionETag:
      description: Quoted aggregate version returned by the committed mutation.
      required: true
      schema: {$ref: '#/components/schemas/VersionETag'}
  securitySchemes:
    HumanSession:
      type: apiKey
      in: cookie
      name: workplane_session
      description: HttpOnly, Secure, SameSite session cookie for human browser requests.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required with the human session cookie for every protected mutation.
    AgentBearer:
      type: http
      scheme: bearer
      bearerFormat: WorkplaneAgentToken
      description: >-
        Scoped agent token carrying the agent identity and delegated human
        principal. An empty project allowlist is organization-scoped. A
        nonempty allowlist is project-scoped: only listed concrete projects
        are eligible, and organization-level project creation is denied.
  parameters:
    OrgId:
      name: org_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    DeliverableId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    DeliverableForecastId:
      name: deliverable_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    EvidenceId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    GateId:
      name: gate_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    FindingId:
      name: finding_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    WorkItemId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    DependencyId:
      name: dependency_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
    ExpectedVersion:
      name: If-Match
      in: header
      required: true
      description: Quoted current aggregate version; stale or missing values deny before mutation.
      schema: {$ref: '#/components/schemas/VersionETag'}
    RealtimeCursor:
      name: cursor
      in: query
      required: false
      schema: {type: string, minLength: 1, maxLength: 2048}
      description: Opaque signed last-consumed position bound to actor, organization, transport, and filters.
    EventTypes:
      name: types
      in: query
      required: false
      schema:
        type: string
        maxLength: 2048
        pattern: '^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*(,[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*)*$'
  responses:
    Problem:
      description: Typed problem response
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    SnapshotRequired:
      description: The requested cursor cannot be resumed; fetch an authorized snapshot before reconnecting.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/SnapshotProblem'}
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email, minLength: 1, maxLength: 320}
        password: {type: string, minLength: 1, maxLength: 1024}
    Session:
      type: object
      additionalProperties: false
      required: [actor_id, actor_kind, expires_at, csrf_token]
      properties:
        actor_id: {type: string, format: uuid}
        actor_kind: {type: string, enum: [human]}
        expires_at: {type: string, format: date-time}
        csrf_token:
          type: string
          minLength: 32
          maxLength: 256
          description: Submit as X-CSRF-Token with the issued session cookie on protected mutations.
    CreateExplorationProject:
      type: object
      additionalProperties: false
      required: [title, outcome, hypothesis, falsifier, decision_criteria, experiment_bound]
      properties:
        title: {type: string, minLength: 1, maxLength: 200, pattern: '\S'}
        outcome: {type: string, minLength: 1, maxLength: 2000, pattern: '\S'}
        hypothesis: {type: string, minLength: 1, maxLength: 2000, pattern: '\S'}
        falsifier: {type: string, minLength: 1, maxLength: 2000, pattern: '\S'}
        decision_criteria:
          type: array
          minItems: 1
          maxItems: 32
          items: {type: string, minLength: 1, maxLength: 500, pattern: '\S'}
        experiment_bound: {type: string, minLength: 1, maxLength: 1000, pattern: '\S'}
    Project:
      type: object
      additionalProperties: false
      required: [id, organization_id, title, outcome, mode, state, version, hypothesis, falsifier, decision_criteria, experiment_bound]
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 200, pattern: '\S'}
        outcome: {type: string, minLength: 1, maxLength: 2000, pattern: '\S'}
        mode: {type: string, enum: [exploration, exploitation]}
        state: {type: string, enum: [proposed, active, held, completed, stopped, cancelled]}
        version: {type: integer, minimum: 1}
        hypothesis: {type: string, minLength: 1, maxLength: 2000, pattern: '\S'}
        falsifier: {type: string, minLength: 1, maxLength: 2000, pattern: '\S'}
        decision_criteria:
          type: array
          minItems: 1
          maxItems: 32
          items: {type: string, minLength: 1, maxLength: 500, pattern: '\S'}
        experiment_bound: {type: string, minLength: 1, maxLength: 1000, pattern: '\S'}
    RecordDecision:
      type: object
      additionalProperties: false
      required: [kind, question, choice, alternatives, rationale, evidence, consequences]
      properties:
        kind: {type: string, enum: [continue]}
        question: {type: string, minLength: 1, maxLength: 2000, pattern: '\S'}
        choice: {type: string, minLength: 1, maxLength: 2000, pattern: '\S'}
        alternatives:
          type: array
          maxItems: 32
          items: {type: string, maxLength: 1000}
        rationale: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
        evidence:
          type: array
          maxItems: 64
          items: {type: string, maxLength: 2000}
        consequences:
          type: array
          maxItems: 32
          items: {type: string, maxLength: 2000}
    LifecycleReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
    DeliverableInput:
      type: object
      additionalProperties: false
      required: [title, description, required, weight, state, acceptance_criteria]
      properties:
        title: {type: string, minLength: 1, maxLength: 200, pattern: '\S'}
        description: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
        required: {type: boolean}
        weight: {type: integer, minimum: 1, maximum: 1000}
        state: {type: string, enum: [draft, ready]}
        acceptance_criteria:
          type: array
          minItems: 1
          maxItems: 32
          items: {type: string, minLength: 1, maxLength: 1000, pattern: '\S'}
    EvidenceSupportInput:
      type: object
      additionalProperties: false
      required: [target_type, target_id]
      properties:
        target_type: {type: string, enum: [deliverable, gate, finding, decision]}
        target_id: {type: string, format: uuid}
    EvidenceInput:
      type: object
      additionalProperties: false
      required: [kind, title, claim, source, metadata, supports]
      properties:
        kind: {type: string, enum: [report, test-run, link, image, observation, measurement]}
        title: {type: string, minLength: 1, maxLength: 200, pattern: '\S'}
        claim: {type: string, minLength: 1, maxLength: 2000, pattern: '\S'}
        source: {type: string, minLength: 1, maxLength: 2000, pattern: '\S'}
        content: {type: string, minLength: 1, maxLength: 16000, pattern: '\S'}
        uri: {type: string, format: uri-reference, minLength: 1, maxLength: 2000}
        metadata:
          type: object
          maxProperties: 32
          additionalProperties: {type: string, minLength: 1, maxLength: 2000}
        supports:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items: {$ref: '#/components/schemas/EvidenceSupportInput'}
    EvidenceRequirementInput:
      type: object
      additionalProperties: false
      required: [kind, claim]
      properties:
        kind: {type: string, enum: [report, test-run, link, image, observation, measurement]}
        claim: {type: string, minLength: 1, maxLength: 2000, pattern: '\S'}
    GateInput:
      type: object
      additionalProperties: false
      required: [name, kind, hard, independence_required, required_evidence]
      properties:
        name: {type: string, minLength: 1, maxLength: 200, pattern: '\S'}
        kind: {type: string, enum: [automated, review, approval]}
        hard: {type: boolean}
        independence_required: {type: boolean}
        required_evidence:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items: {$ref: '#/components/schemas/EvidenceRequirementInput'}
    FindingInput:
      type: object
      additionalProperties: false
      required: [title, detail, blocking]
      properties:
        title: {type: string, minLength: 1, maxLength: 200, pattern: '\S'}
        detail: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
        blocking: {type: boolean}
    VerdictInput:
      type: object
      additionalProperties: false
      required: [result, evidence_ids, findings]
      properties:
        result: {type: string, enum: [pass, fail]}
        evidence_ids:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items: {type: string, format: uuid}
        findings:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/FindingInput'}
    FindingDispositionInput:
      type: object
      additionalProperties: false
      required: [evidence_ids, rationale]
      properties:
        evidence_ids:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items: {type: string, format: uuid}
        rationale: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
    SubmissionInput:
      type: object
      additionalProperties: false
      required: [evidence_ids, note]
      properties:
        evidence_ids:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items: {type: string, format: uuid}
        note: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
    BounceInput:
      type: object
      additionalProperties: false
      required: [finding_id, rationale]
      properties:
        finding_id: {type: string, format: uuid}
        rationale: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
    ReviewNoteInput:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
    WaiverInput:
      type: object
      additionalProperties: false
      required: [question, choice, alternatives, rationale, evidence_ids, consequences, residual_risk]
      properties:
        question: {type: string, minLength: 1, maxLength: 2000, pattern: '\S'}
        choice: {type: string, minLength: 1, maxLength: 2000, pattern: '\S'}
        alternatives:
          type: array
          maxItems: 32
          items: {type: string, maxLength: 1000}
        rationale: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
        evidence_ids:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items: {type: string, format: uuid}
        consequences:
          type: array
          maxItems: 32
          items: {type: string, maxLength: 2000}
        residual_risk: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
    WorkItemCreateInput:
      type: object
      additionalProperties: false
      required: [title, description, priority]
      properties:
        title: {type: string, minLength: 1, maxLength: 200, pattern: '\S'}
        description: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
        priority: {type: string, enum: [low, normal, high, critical]}
        deliverable_id: {type: string, format: uuid}
      examples:
        - {title: Implement lifecycle guard, description: Reject every undeclared state edge, priority: high}
    WorkItemUpdateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: {type: string, minLength: 1, maxLength: 200, pattern: '\S'}
        description: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
        priority: {type: string, enum: [low, normal, high, critical]}
        deliverable_id: {type: string, format: uuid}
      examples:
        - {priority: critical}
    WorkItemAssignInput:
      type: object
      additionalProperties: false
      required: [assignee_id]
      properties:
        assignee_id: {type: string, format: uuid}
      examples:
        - {assignee_id: 00000000-0000-4000-8000-000000000001}
    WorkItemTransitionInput:
      type: object
      additionalProperties: false
      required: [command, reason, evidence_ids]
      properties:
        command: {type: string, enum: [start, request_review, bounce, accept, cancel]}
        reason: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
        evidence_ids:
          type: array
          maxItems: 64
          uniqueItems: true
          items: {type: string, format: uuid}
        finding_id: {type: string, format: uuid}
      examples:
        - {command: request_review, reason: Ready for review, evidence_ids: [00000000-0000-4000-8000-000000000030]}
    DependencyAddInput:
      type: object
      additionalProperties: false
      required: [target_work_item_id, kind, expected_target_version]
      properties:
        target_work_item_id: {type: string, format: uuid}
        kind: {type: string, enum: [blocks, relates, caused-by]}
        expected_target_version: {type: integer, minimum: 1}
      examples:
        - {target_work_item_id: 00000000-0000-4000-8000-000000000042, kind: blocks, expected_target_version: 3}
    DependencyRemoveInput:
      type: object
      additionalProperties: false
      required: [expected_dependency_version, expected_target_version]
      properties:
        expected_dependency_version: {type: integer, minimum: 1}
        expected_target_version: {type: integer, minimum: 1}
      examples:
        - {expected_dependency_version: 1, expected_target_version: 3}
    WorkItemBatchTransitionEntry:
      type: object
      additionalProperties: false
      required: [work_item_id, expected_version, command, reason, evidence_ids]
      properties:
        work_item_id: {type: string, format: uuid}
        expected_version: {type: integer, minimum: 1}
        command: {type: string, enum: [start, request_review, bounce, accept, cancel]}
        reason: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
        evidence_ids:
          type: array
          maxItems: 64
          uniqueItems: true
          items: {type: string, format: uuid}
        finding_id: {type: string, format: uuid}
    WorkItemBatchTransitionInput:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: {$ref: '#/components/schemas/WorkItemBatchTransitionEntry'}
      examples:
        - items:
            - {work_item_id: 00000000-0000-4000-8000-000000000041, expected_version: 2, command: start, reason: Assigned and unblocked, evidence_ids: []}
    PromotionDecision:
      type: object
      additionalProperties: false
      required: [question, choice, alternatives, rationale, evidence, consequences]
      properties:
        question: {type: string, minLength: 1, maxLength: 2000, pattern: '\S'}
        choice: {type: string, minLength: 1, maxLength: 2000, pattern: '\S'}
        alternatives: {type: array, maxItems: 32, items: {type: string, maxLength: 1000}}
        rationale: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
        evidence: {type: array, maxItems: 64, items: {type: string, maxLength: 2000}}
        consequences: {type: array, maxItems: 32, items: {type: string, maxLength: 2000}}
    PromoteProjectRequest:
      type: object
      additionalProperties: false
      required: [decision, residual_uncertainty, priority_rationale, deliverables]
      properties:
        decision: {$ref: '#/components/schemas/PromotionDecision'}
        residual_uncertainty: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
        priority_rationale: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
        deliverables:
          type: array
          minItems: 1
          maxItems: 32
          items: {$ref: '#/components/schemas/DeliverableInput'}
    ForecastInput:
      type: object
      additionalProperties: false
      required: [p50_at, p90_at, review_after, basis, assumptions, reason_codes, impact]
      properties:
        p50_at: {type: string, format: date-time}
        p90_at: {type: string, format: date-time}
        review_after: {type: string, format: date-time}
        basis: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
        assumptions:
          type: array
          minItems: 1
          maxItems: 32
          items: {type: string, minLength: 1, maxLength: 1000, pattern: '\S'}
        reason_codes:
          type: array
          minItems: 1
          maxItems: 9
          uniqueItems: true
          items:
            type: string
            enum: [scope-change, new-evidence, dependency-change, capacity-change, quality-finding, incident, estimate-correction, hold-change, other]
        impact: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
    TargetInput:
      type: object
      additionalProperties: false
      required: [target_at, reason]
      properties:
        target_at: {type: string, format: date-time}
        reason: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
    DeadlineInput:
      type: object
      additionalProperties: false
      required: [deadline_at, source, description]
      properties:
        deadline_at: {type: string, format: date-time}
        source: {type: string, enum: [contract, launch-window, demonstration, regulation, other]}
        description: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
    Decision:
      type: object
      additionalProperties: false
      required: [id, project_id, actor_id, actor_kind, principal_id, recorded_at, kind, question, choice, alternatives, rationale, evidence, consequences]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        actor_id: {type: string, format: uuid}
        actor_kind: {type: string, enum: [human, agent]}
        principal_id:
          type: [string, 'null']
          format: uuid
        recorded_at: {type: string, format: date-time}
        kind: {type: string, enum: [continue, promote, waiver]}
        question: {type: string, minLength: 1, maxLength: 2000, pattern: '\S'}
        choice: {type: string, minLength: 1, maxLength: 2000, pattern: '\S'}
        alternatives:
          type: array
          maxItems: 32
          items: {type: string, maxLength: 1000}
        rationale: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
        evidence:
          type: array
          maxItems: 64
          items: {type: string, maxLength: 2000}
        consequences:
          type: array
          maxItems: 32
          items: {type: string, maxLength: 2000}
    Deliverable:
      type: object
      additionalProperties: false
      required: [id, organization_id, project_id, title, description, required, weight, state, acceptance_criteria, version, waiver_decision_id, created_by, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
