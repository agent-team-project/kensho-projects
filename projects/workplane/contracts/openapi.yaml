openapi: 3.1.0
info:
  title: Workplane Walking Slice API
  version: 0.1.0-m0
  description: Contract-only M0 surface. Operations are implemented in M1.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/session/login:
    post:
      operationId: login
      x-permission-actions: [session.login]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Authenticated human session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/orgs/{org_id}/projects:
    parameters:
      - {$ref: '#/components/parameters/OrgId'}
    post:
      operationId: createProject
      x-permission-actions: [project.create]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateExplorationProject'}
      responses:
        '201':
          description: Exploration project created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/projects/{project_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      operationId: getProject
      x-permission-actions: [project.read]
      responses:
        '200':
          description: Project projection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/projects/{project_id}/decisions:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    post:
      operationId: recordDecision
      x-permission-actions: [decision.record]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordDecision'}
      responses:
        '201':
          description: Decision recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Decision'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/projects/{project_id}/activity:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      operationId: listProjectActivity
      x-permission-actions: [project.read]
      responses:
        '200':
          description: Immutable activity entries
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Activity'}
        default: {$ref: '#/components/responses/Problem'}
components:
  parameters:
    OrgId:
      name: org_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
  responses:
    Problem:
      description: Typed problem response
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 1}
    Session:
      type: object
      additionalProperties: false
      required: [actor_id, actor_kind, expires_at]
      properties:
        actor_id: {type: string, format: uuid}
        actor_kind: {type: string, enum: [human]}
        expires_at: {type: string, format: date-time}
    CreateExplorationProject:
      type: object
      additionalProperties: false
      required: [title, outcome, hypothesis, falsifier, decision_criteria, experiment_bound]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        outcome: {type: string, minLength: 1, maxLength: 2000}
        hypothesis: {type: string, minLength: 1, maxLength: 2000}
        falsifier: {type: string, minLength: 1, maxLength: 2000}
        decision_criteria:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
        experiment_bound: {type: string, minLength: 1}
    Project:
      type: object
      additionalProperties: false
      required: [id, organization_id, title, outcome, mode, state, version]
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        title: {type: string}
        outcome: {type: string}
        mode: {type: string, enum: [exploration, exploitation]}
        state: {type: string, enum: [proposed, active, held, completed, stopped, cancelled]}
        version: {type: integer, minimum: 1}
    RecordDecision:
      type: object
      additionalProperties: false
      required: [kind, question, choice, alternatives, rationale, evidence, consequences]
      properties:
        kind: {type: string, enum: [continue, pivot, stop, promote, scope, forecast, waiver, risk-acceptance, complete, cancel]}
        question: {type: string, minLength: 1}
        choice: {type: string, minLength: 1}
        alternatives: {type: array, items: {type: string}}
        rationale: {type: string, minLength: 1}
        evidence: {type: array, items: {type: string}}
        consequences: {type: array, items: {type: string}}
    Decision:
      allOf:
        - {$ref: '#/components/schemas/RecordDecision'}
        - type: object
          required: [id, actor_id, recorded_at]
          properties:
            id: {type: string, format: uuid}
            actor_id: {type: string, format: uuid}
            recorded_at: {type: string, format: date-time}
    Activity:
      type: object
      additionalProperties: false
      required: [event_id, event_type, actor_id, occurred_at]
      properties:
        event_id: {type: string, format: uuid}
        event_type: {type: string}
        actor_id: {type: string, format: uuid}
        occurred_at: {type: string, format: date-time}
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, request_id]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        code: {type: string}
        request_id: {type: string}
