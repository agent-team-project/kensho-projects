# Public Workplane definitions only. Runtime state and credentials are not published.

[pm]
provider = "github"

[github]
owner = "agent-team-project"
repo = "kensho-projects"

[project]
id = "workplane-study-002"

[runtime]
kind = "codex"

[authority]
enforcement = "audit"

[authority.agents.research-worker]
allow = ["budget.status", "inbox.*", "job.show", "job.gate.*:own", "job.step:own", "status.*"]

[authority.agents.research-verifier]
allow = ["budget.status", "inbox.*", "job.show", "job.gate.*:own", "job.step:own", "status.*"]

[authority.agents.research-reviewer]
allow = ["budget.status", "inbox.*", "job.show", "job.gate.*:own", "status.*"]
